name: saath_khata
description: "SaathKhata — The Two-Sided Shared Ledger App for India"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_bloc: ^8.1.6
  provider: ^6.1.2
  equatable: ^2.0.5
  hydrated_bloc: ^9.1.5
  
  # Navigation
  go_router: ^14.7.2
  
  # UI & Styling
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  responsive_framework: ^1.5.1
  
  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.5.0
  
  # Localization & Utils
  intl: ^0.20.2
  path_provider: ^2.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Icons & Extra UI
  font_awesome_flutter: ^10.7.0
  rive: ^0.13.0

  # Networking
  dio: ^5.8.0+1
  socket_io_client: ^2.0.3+1

  # Voice entry (on-device speech-to-text; requests mic permission internally)
  speech_to_text: ^7.0.0

  # Secure storage (tokens + onboarding flag)
  flutter_secure_storage: ^9.2.2

  # Image picking (profile photo + ledger payment proof)
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.3.0

  # Map & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  http: ^1.2.2
  url_launcher: ^6.3.1

  # PDF generation & sharing
  pdf: ^3.12.0
  printing: ^5.14.3

  # Environment variables
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  injectable_generator: ^2.6.2
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/
